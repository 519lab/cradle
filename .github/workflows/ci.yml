name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --group dev
      - name: Ruff
        run: uv run ruff check .
      - name: Pytest
        run: uv run pytest
        env:
          CRADLE_API_KEY: ci-test-key

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker compose -f compose.ci.yml build
      - name: Smoke
        run: |
          docker compose -f compose.ci.yml up -d
          trap 'docker compose -f compose.ci.yml logs; docker compose -f compose.ci.yml down' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz && curl -fsS http://127.0.0.1:8000/readyz; then
              trap 'docker compose -f compose.ci.yml down' EXIT
              exit 0
            fi
            sleep 1
          done
          exit 1
        env:
          CRADLE_API_KEY: ci-test-key
