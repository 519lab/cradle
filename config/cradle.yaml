server:
  host: 127.0.0.1
  port: 8000
  max_body_bytes: 1048576

data_dir: ./data

pipeline_version: v1

auth:
  allow_insecure_loopback: false
  keys: []

# Fallback when no route matches (llama.cpp / LiteLLM / etc).
upstream:
  base_url: http://127.0.0.1:8080/v1
  api_key_env: CRADLE_UPSTREAM_API_KEY
  timeout_s: 120
  pass_through_client_auth: true
  models_passthrough: false
  models: ["gpt-4o-mini"]

# Named OpenAI-compatible backends. First matching route wins.
# upstreams:
#   openai:
#     base_url: https://api.openai.com/v1
#     models: ["gpt-4o", "gpt-4o-mini"]
#   xai:
#     base_url: https://api.x.ai/v1
#     models: ["grok-4", "grok-3"]
#   litellm:
#     base_url: http://127.0.0.1:4000/v1
# routes:
#   - model: "gpt-*"
#     to: openai
#   - model: "o1-*"
#     to: openai
#   - model: "o3-*"
#     to: openai
#   - model: "grok-*"
#     to: xai
#   - model: "*"
#     to: default

features:
  cache: true
  compression: true
  structure: false
  l2: true
  reconstruction: true
  local_1b: false

cache:
  ttl_s: 86400
  max_temperature: 1.0
  evict_old_pipeline: true
  purge_interval_s: 300
  l1_size_limit_bytes: 1000000000

l2:
  mode: local
  collection: cradle_l2
  cosine_threshold: 0.90
  max_messages: 2
  embed_timeout_s: 2.0
  model: BAAI/bge-small-en-v1.5
  dim: 384
  onnx_threads: null
  points_warn: 20000

compress:
  structure_min_chars: 400
  min_tokens: 16

reconstruct:
  mode: wrap
  tenants: {}

metrics:
  enabled: true
  require_auth: true
