services:
  cradle:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      CRADLE_SERVER__HOST: "0.0.0.0"
      CRADLE_DATA_DIR: /data
      CRADLE_API_KEY: ${CRADLE_API_KEY:-}
      CRADLE_UPSTREAM_API_KEY: ${CRADLE_UPSTREAM_API_KEY:-}
      CRADLE_UPSTREAM_BASE_URL: ${CRADLE_UPSTREAM_BASE_URL:-http://127.0.0.1:8080/v1}
    volumes:
      - cradle-data:/data

volumes:
  cradle-data:
