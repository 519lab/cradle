services:
  cradle:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BAKE_EMBEDDINGS: "1"
    image: cradle:local
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false
    environment:
      CRADLE_SERVER__HOST: "0.0.0.0"
      CRADLE_DATA_DIR: /data
      CRADLE_CONFIG: /app/config/cradle.yaml
      FASTEMBED_CACHE_PATH: /opt/cradle/models/fastembed
      CRADLE_API_KEY: ${CRADLE_API_KEY:-}
      CRADLE_UPSTREAM_API_KEY: ${CRADLE_UPSTREAM_API_KEY:-}
      CRADLE_UPSTREAM_BASE_URL: ${CRADLE_UPSTREAM_BASE_URL:-http://host.docker.internal:8080/v1}
    volumes:
      - cradle-data:/data
    restart: unless-stopped

volumes:
  cradle-data:
