name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --group dev
      - name: Ruff
        run: uv run ruff check .
      - name: Pytest
        run: uv run pytest
        env:
          CRADLE_API_KEY: ci-test-key
