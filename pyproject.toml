[project]
name = "cradle"
version = "0.1.0"
description = "Local semantic cache and token-compression proxy for OpenAI-compatible APIs"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Greg Grace", email = "ggrace@519lab.com" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "diskcache>=5.6",
    "qdrant-client>=1.12",
    "fastembed>=0.5,<0.8",
    "onnxruntime>=1.19",
    "tiktoken>=0.7",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
local-1b = ["llama-cpp-python"]

[project.scripts]
cradle = "cradle.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"



[tool.pytest.ini_options]
addopts = "-q -m \"not embed\" --cov=cradle --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "embed: real FastEmbed/BGE (downloads model; not default CI)",
]

[tool.coverage.run]
source = ["cradle"]
omit = ["src/cradle/eval/*", "src/cradle/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
